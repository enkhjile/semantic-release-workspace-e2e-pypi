name: Validate PyPI wheel compatibility
on:
  push:
    branches: [fix/pypi-manylinux-fixture]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
          python-version: "3.15.2"
          enable-cache: false
      - name: Build the approved version without uploading
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          sed -i 's/version = "0.0.0"/version = "0.1.0a1"/' packages/core/pyproject.toml
          uv build --config-setting="build-args=--compatibility manylinux_2_39" --no-sources --out-dir "$RUNNER_TEMP/distributions" packages/core
          ls "$RUNNER_TEMP/distributions"/*manylinux_2_39_x86_64.whl
