name: Validate PyPI app
on:
  push:
    branches: [alpha]
    paths:
      - packages/app/**
      - .github/workflows/validate-app.yml
  workflow_dispatch:
    inputs:
      public:
        type: boolean
        default: false
        description: Install the published app from PyPI
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
          python-version: "3.15.2"
          enable-cache: false
      - name: Build app distributions without uploading
        if: ${{ !inputs.public }}
        run: |
          sed -i 's/version = "0.0.0"/version = "0.1.0a2"/' packages/app/pyproject.toml
          UV_NO_CONFIG=1 uv build --no-sources --out-dir "$RUNNER_TEMP/dist" packages/app
      - name: Install and exercise app with its published core dependency
        env:
          PUBLIC: ${{ inputs.public || false }}
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          if [ "$PUBLIC" = "true" ]; then
            uv pip install --python "$RUNNER_TEMP/smoke/bin/python" --index-url https://pypi.org/simple --only-binary :all: 'enkhjile-srw-pypi-app==0.1.0a2'
          else
            uv pip install --python "$RUNNER_TEMP/smoke/bin/python" --index-url https://pypi.org/simple --only-binary :all: "$RUNNER_TEMP"/dist/*.whl
          fi
          "$RUNNER_TEMP/smoke/bin/python" -c 'from importlib.metadata import version; assert version("enkhjile-srw-pypi-app") == "0.1.0a2"; assert version("enkhjile-srw-pypi-core") == "0.1.0a1"'
          "$RUNNER_TEMP/smoke/bin/python" -m enkhjile_srw_pypi_app
          "$RUNNER_TEMP/smoke/bin/srw-pypi-core"
