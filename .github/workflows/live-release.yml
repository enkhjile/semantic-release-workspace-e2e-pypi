name: Live PyPI acceptance
on:
  push:
    branches: [alpha]
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish the reviewed batch using PyPI OIDC
      interrupt_after_publish:
        type: boolean
        default: false
        description: Deliberately interrupt after workspace publication
      forbid_upload:
        type: boolean
        default: false
        description: Prove recovery needs neither builds nor uploads
permissions:
  contents: read
concurrency:
  group: live-pypi
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/alpha'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch retained release state
        run: git fetch origin '+refs/notes/*:refs/notes/*' '+refs/semantic-release-workspace/*:refs/semantic-release-workspace/*'
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        with:
          cache: true
          require-lockfile: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
          python-version: "3.15.2"
          enable-cache: false
      - name: Verify exact product build
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; const p=JSON.parse(fs.readFileSync("PRODUCT_SOURCE.json")); for (const [file,expected] of [[p.archive,p.archiveSha256],["node_modules/semantic-release-workspace/dist/index.mjs",p.entrySha256]]) { if(crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex")!==expected) throw new Error("Product build mismatch"); } console.log("Verified product commit", p.commit);'
      - name: Select Python and Rust
        run: |
          uv python install 3.15.2
          echo "$(dirname "$(uv python find 3.15.2)")" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Forbid rebuilds and uploads during recovery
        if: inputs.forbid_upload
        run: |
          export UV_REAL="$(command -v uv)"
          python3 - <<'PYTHON'
          import os, pathlib, shlex
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'retry-guard'
          directory.mkdir()
          wrapper = directory / 'uv'
          wrapper.write_text('#!/bin/sh\ncase "$1" in build|publish) echo "Unexpected rebuild or upload" >&2; exit 97;; esac\nexec ' + shlex.quote(os.environ['UV_REAL']) + ' "$@"\n')
          wrapper.chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as file:
              file.write(str(directory) + '\n')
          PYTHON
      - name: Preview release without writes
        run: pnpm preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish approved batch
        if: vars.PYPI_LIVE_APPROVED == 'true' && (github.event_name == 'push' || inputs.publish)
        run: pnpm release
        env:
          SRW_TEST_INTERRUPT_AFTER_PUBLISH: ${{ inputs.interrupt_after_publish && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
