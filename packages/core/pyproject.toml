[project]
name = "enkhjile-srw-pypi-core"
version = "0.1.0a1"
description = "Disposable semantic-release-workspace PyPI acceptance fixture"
requires-python = ">=3.10"
license = "MIT"
[build-system]
requires = ["maturin==1.16.0"]
build-backend = "_build_backend"
backend-path = ["."]
[tool.maturin]
bindings = "bin"
include = [{ path = "_build_backend.py", format = "sdist" }]
